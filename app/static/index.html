<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lettura distinta</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1c1f24; --muted:#5f6670; --line:#dde1e6;
          --accent:#1f5fbf; --warn-bg:#fff4dc; --warn:#7a5200; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14171b; --card:#1d2126; --text:#e6e8eb; --muted:#9aa2ac; --line:#30363d;
            --accent:#6ea3ff; --warn-bg:#3a2e12; --warn:#f3cf7a; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.45 system-ui, sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:1100px; margin:0 auto; padding:16px; }
  h1 { font-size:20px; margin:0 0 12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:14px; }
  button { font:inherit; padding:10px 16px; border-radius:8px; border:0; background:var(--accent); color:#fff; cursor:pointer; }
  button:disabled { opacity:.5; }
  button.secondary { background:transparent; color:var(--accent); border:1px solid var(--accent); }
  input[type=file] { width:100%; margin-bottom:10px; }
  .meta { color:var(--muted); font-size:14px; }
  .avvisi { background:var(--warn-bg); color:var(--warn); border-radius:8px; padding:10px 14px; }
  .avvisi ul { margin:6px 0 0; padding-left:18px; }
  table { border-collapse:collapse; width:100%; }
  th, td { border-bottom:1px solid var(--line); padding:4px 6px; text-align:left; }
  th { font-size:13px; color:var(--muted); font-weight:600; }
  td input, td select { width:100%; font:inherit; background:transparent; color:inherit; border:1px solid transparent; border-radius:4px; padding:3px 4px; }
  td input:focus, td select:focus { border-color:var(--accent); outline:none; }
  td.dubbio input { border-color:var(--warn); }
  .azioni { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  #stato { margin-top:8px; }
</style>
</head>
<body>
<main>
  <h1>Lettura distinta di gara</h1>

  <div class="card">
    <input type="file" id="file" accept="image/*,application/pdf" capture="environment">
    <button id="leggi">Leggi distinta</button>
    <div id="stato" class="meta"></div>
  </div>

  <div id="risultato" hidden>
    <div class="card avvisi" id="box-avvisi" hidden><strong>Da controllare</strong><ul id="avvisi"></ul></div>
    <div class="card">
      <table>
        <thead><tr><th>N°</th><th>Cognome</th><th>Nome</th></tr></thead>
        <tbody id="righe"></tbody>
      </table>
      <div class="azioni">
        <button id="scarica">Scarica JSON corretto</button>
        <button class="secondary" id="copia">Copia elenco</button>
      </div>
    </div>
  </div>
</main>
<script>
let distinta = null;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

$("leggi").onclick = async () => {
  const f = $("file").files[0];
  if (!f) { $("stato").textContent = "Scegli prima una foto o un PDF."; return; }
  $("leggi").disabled = true;
  $("stato").textContent = "Lettura in corso, può richiedere fino a un minuto…";
  const fd = new FormData(); fd.append("file", f);
  try {
    const r = await fetch("/api/estrai", { method: "POST", body: fd });
    const body = await r.json();
    if (!r.ok) throw new Error(body.detail || r.statusText);
    distinta = body.distinta;
    mostra(body.avvisi);
    $("stato").textContent = "Fatto. Controlla e correggi i dati evidenziati.";
  } catch (e) {
    $("stato").textContent = "Errore: " + e.message;
  } finally {
    $("leggi").disabled = false;
  }
};

function mostra(avvisi) {
  $("risultato").hidden = false;
  $("box-avvisi").hidden = !avvisi.length;
  $("avvisi").innerHTML = avvisi.map((a) => `<li>${esc(a)}</li>`).join("");
  $("righe").innerHTML = distinta.giocatori.map((g, i) => {
    const d = g.dubbi.length ? ' class="dubbio"' : "";
    return `<tr title="${esc(g.dubbi.join("; "))}">
      <td${d}><input data-i="${i}" data-k="numero" value="${esc(g.numero)}" inputmode="numeric" size="2"></td>
      <td${d}><input data-i="${i}" data-k="cognome" value="${esc(g.cognome)}"></td>
      <td${d}><input data-i="${i}" data-k="nome" value="${esc(g.nome)}"></td>
    </tr>`;
  }).join("");
}

$("righe").addEventListener("change", (e) => {
  const el = e.target, g = distinta.giocatori[el.dataset.i], k = el.dataset.k;
  g[k] = k === "numero" ? (el.value === "" ? null : Number(el.value)) : el.value.trim().toUpperCase();
});

$("scarica").onclick = () => {
  const dati = distinta.giocatori.map(({ numero, cognome, nome }) => ({ numero, cognome, nome }));
  const blob = new Blob([JSON.stringify(dati, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "distinta.json";
  a.click();
};

$("copia").onclick = async () => {
  const testo = distinta.giocatori.map((g) => `${g.numero ?? "?"} ${g.cognome} ${g.nome}`).join("\n");
  await navigator.clipboard.writeText(testo);
  $("stato").textContent = "Elenco copiato.";
};
</script>
</body>
</html>
